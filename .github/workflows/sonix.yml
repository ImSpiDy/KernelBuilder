name: REL-WF

on:
   push:
     branches: [ "build_rel" ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: nexgang/ubuntu:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build release
        env:
          gh_token: ${{ secrets.GH_TOKEN }}
          VEX_KEYS: ${{ secrets.VEX_TOKEN }}
        run: |
          git clone --depth=1 https://github.com/ImSpiDy/Scripts reup -b ru
          cd reup
          bash lav*.sh

